.github/workflows/build-apk.name: Build Battle Royale 3D APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad16cda4b8d0cfdd123a31c62f26768700f" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187473751e9f9a4b6795057f59781af5344" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8d07" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Prepare debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK to Game Name
        run: cp app/build/outputs/apk/debug/app-debug.apk Battle-Royale-3D.apk

      - name: Publish Direct APK to GitHub Releases (No ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Battle-Royale-3D.apk --clobber
          else
            gh release create latest-apk Battle-Royale-3D.apk \
              --title "Battle Royale 3D APK" \
              --notes "Direct Android APK download (No ZIP)." \
              --latest
          fi

      - name: Upload APK Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Royale-3D-APK
          path: Battle-Royale-3D.apk
